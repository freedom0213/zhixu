server:
  port: 8085
  tomcat:
    uri-encoding: UTF-8
spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: message-service
  cloud:
    nacos:
      config:
        file-extension: yaml
        shared-configs:
          - data-id: shared-spring.yaml
            refresh: false
          - data-id: shared-redis.yaml
            refresh: false
          - data-id: shared-mybatis.yaml
            refresh: false
          - data-id: shared-logs.yaml
            refresh: false
          - data-id: shared-feign.yaml
            refresh: false
          - data-id: shared-mq.yaml
            refresh: false
tj:
  swagger:
    enable: true
    enableResponseWrap: true
    package-path: com.zhixu.message.controller
    title: Tianji message service
    description: Message service
    contact-name: Tianji
    contact-url: https://github.com/freedom0213/zhixu
    contact-email: ''
    version: v1.0
  auth:
    resource:
      enable: true
      excludeLoginPaths:
        - /students/register
        - /users/detail/{isStaff}
        - /users/list
        - GET:/users/{id}
        - /users/{id}/type
        - /users/ids
  jdbc:
    database: tj_message
  sms:
    ali:
      accessId: ${ALI_SMS_ACCESS_ID:}
      accessSecret: ${ALI_SMS_ACCESS_SECRET:}
