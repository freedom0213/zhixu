<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">知序学堂本地微服务架构</title>
  <desc id="desc">浏览器访问本地前端和 API Gateway，网关路由到领域服务，服务依赖 Nacos、MySQL、Redis、RabbitMQ 和可选的 Elasticsearch。</desc>
  <rect width="1200" height="620" fill="#0f171b"/>
  <rect x="28" y="28" width="1144" height="564" rx="18" fill="#121e23" stroke="#2b3b42"/>
  <g font-family="Segoe UI, PingFang SC, sans-serif">
    <text x="64" y="72" font-size="16" font-weight="700" fill="#7dd3c7" letter-spacing="3">ZHIXU / LOCAL DEMO STACK</text>
    <text x="64" y="112" font-size="32" font-weight="700" fill="#f3f6f8">知序学堂 · 可复现的本地服务链路</text>
    <text x="64" y="140" font-size="16" fill="#9eafb7">Vue 3 用户端 · Spring Cloud 微服务 · Docker Compose</text>
  </g>
  <g font-family="Segoe UI, PingFang SC, sans-serif">
    <rect x="64" y="184" width="190" height="76" rx="10" fill="#1d3035" stroke="#4d7475"/>
    <text x="159" y="216" text-anchor="middle" font-size="20" font-weight="700" fill="#f3f6f8">浏览器</text>
    <text x="159" y="241" text-anchor="middle" font-size="14" fill="#7dd3c7">用户端入口</text>
    <rect x="294" y="184" width="190" height="76" rx="10" fill="#7dd3c7"/>
    <text x="389" y="216" text-anchor="middle" font-size="20" font-weight="700" fill="#0f171b">前端容器</text>
    <text x="389" y="241" text-anchor="middle" font-size="14" fill="#234342">:18082</text>
    <rect x="524" y="184" width="190" height="76" rx="10" fill="#f1b878"/>
    <text x="619" y="216" text-anchor="middle" font-size="20" font-weight="700" fill="#1b1915">API Gateway</text>
    <text x="619" y="241" text-anchor="middle" font-size="14" fill="#4c3922">:10010</text>
    <rect x="754" y="184" width="190" height="76" rx="10" fill="#1d3035" stroke="#4d7475"/>
    <text x="849" y="216" text-anchor="middle" font-size="20" font-weight="700" fill="#f3f6f8">Nginx</text>
    <text x="849" y="241" text-anchor="middle" font-size="14" fill="#7dd3c7">:80 /healthz</text>
    <path d="M254 222H294M484 222H524M714 222H754" stroke="#6d878a" stroke-width="3"/>
    <path d="M619 260V296" stroke="#6d878a" stroke-width="3"/>
    <rect x="214" y="296" width="810" height="116" rx="12" fill="#17262c" stroke="#36545b"/>
    <text x="244" y="325" font-size="14" font-weight="700" fill="#7dd3c7" letter-spacing="1">DOMAIN SERVICES</text>
    <g fill="#e7eef0" font-size="15">
      <text x="244" y="354">认证 · 用户 · 课程 · 学习 · 考试</text>
      <text x="244" y="381">交易 · 互动 · 营销 · AI 知识库</text>
      <text x="638" y="354">搜索 · 媒资 · 消息 · 数据</text>
      <text x="638" y="381">按需启动：search profile / 第三方服务可选</text>
    </g>
    <path d="M619 412V444" stroke="#6d878a" stroke-width="3"/>
    <rect x="64" y="444" width="1070" height="104" rx="12" fill="#101a1e" stroke="#2b3b42"/>
    <text x="92" y="474" font-size="14" font-weight="700" fill="#f1b878" letter-spacing="1">LOCAL INFRASTRUCTURE</text>
    <g font-size="14" fill="#d8e2e5">
      <text x="92" y="507">Nacos :8848</text>
      <text x="270" y="507">MySQL :13306 → 容器 :3306</text>
      <text x="540" y="507">Redis :6379</text>
      <text x="700" y="507">RabbitMQ :5672 / 管理 :15672</text>
      <text x="92" y="532">Elasticsearch :19200 → 容器 :9200（search profile）</text>
    </g>
  </g>
</svg>
