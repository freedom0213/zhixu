server:
  port: 8087
  tomcat:
    uri-encoding: UTF-8
  error:
    include-message: always
spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: pay-service
  cloud:
    nacos:
      config:
        file-extension: yaml
        shared-configs:
          - dataId: shared-spring.yaml
          - dataId: shared-redis.yaml
          - dataId: shared-mybatis.yaml
          - dataId: shared-logs.yaml
          - dataId: shared-feign.yaml
          - dataId: shared-mq.yaml
          - dataId: shared-xxljob.yaml
tj:
  swagger:
    enable: true
    enableResponseWrap: true
    package-path: com.zhixu.pay.controller
    title: Tianji pay service
    description: Payment service
    contact-name: Tianji
    contact-url: https://github.com/freedom0213/zhixu
    contact-email: ''
    version: v1.0
  jdbc:
    database: tj_pay
  pay:
    notifyHost: ${PAY_NOTIFY_HOST:http://localhost:10010/ps}
    ali:
      appId: ${ALI_PAY_APP_ID:}
      merchantPrivateKey: ${ALI_PAY_MERCHANT_PRIVATE_KEY:}
      publicKey: ${ALI_PAY_PUBLIC_KEY:}
    wx:
      appId: ${WX_PAY_APP_ID:}
      mchId: ${WX_PAY_MCH_ID:}
      mchSerialNo: ${WX_PAY_MCH_SERIAL_NO:}
      privateKey: ${WX_PAY_PRIVATE_KEY:}
      apiV3Key: ${WX_PAY_API_V3_KEY:}
