server:
  port: 8084
  tomcat:
    uri-encoding: UTF-8
spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: media-service
  cloud:
    nacos:
      config:
        file-extension: yaml
        shared-configs:
          - data-id: shared-spring.yaml
            refresh: false
          - data-id: shared-redis.yaml
            refresh: false
          - data-id: shared-logs.yaml
            refresh: false
          - data-id: shared-mybatis.yaml
            refresh: false
          - data-id: shared-feign.yaml
            refresh: false
tj:
  swagger:
    enable: true
    package-path: com.tianji.media.controller
    title: Tianji media service
    description: Media management service
    contact-name: Tianji
    contact-url: https://github.com/freedom0213/zhixu
    contact-email: ''
    version: v1.0
    enableResponseWrap: true
  auth:
    resource:
      enable: true
      excludeLoginPaths:
        - /medias/signature/play
  jdbc:
    database: tj_media
  platform:
    # A supported enum value is required for startup. Cloud uploads remain disabled below.
    file: QI_NIU
    media: QI_NIU
  tencent:
    appId: ${TENCENT_APP_ID:}
    secretId: ${TENCENT_SECRET_ID:}
    secretKey: ${TENCENT_SECRET_KEY:}
    vod:
      enable: false
    cos:
      enable: false
